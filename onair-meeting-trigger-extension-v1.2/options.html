<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ON-AIR Settings</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; }
    .card { max-width: 880px; border: 1px solid #ddd; border-radius: 14px; padding: 16px; margin: 12px 0; }
    h1 { margin: 0 0 8px 0; font-size: 20px; }
    h2 { margin: 0 0 8px 0; font-size: 16px; }
    label { display:block; margin: 8px 0; }
    input[type="text"], input[type="number"] { width: 100%; max-width: 620px; padding: 8px; border-radius: 10px; border: 1px solid #ccc; }
    .row { display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .muted { color:#666; font-size: 13px; }
    .btns { display:flex; gap: 10px; align-items:center; margin-top: 12px; flex-wrap: wrap; }
    button { padding: 8px 12px; border-radius: 10px; border: 1px solid #ccc; background: #fafafa; cursor:pointer; }
    button.primary { border-color:#0aa; background:#e9ffff; }
    .status { margin-left: 10px; font-size: 13px; color:#0a0; }
    code { background:#f4f4f4; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>ON-AIR Meeting Trigger — Settings</h1>

  <div class="card">
    <h2>1) Services</h2>
    <label><input type="checkbox" id="svc_meet"> Google Meet (meet.google.com)</label>
    <label><input type="checkbox" id="svc_teams"> Microsoft Teams (teams.microsoft.com)</label>
    <label><input type="checkbox" id="svc_zoom"> Zoom (zoom.us / app.zoom.us)</label>
  </div>

  <div class="card">
    <h2>2) Trigger mode</h2>
    <label><input type="radio" name="mode" value="ANY_TAB" id="mode_any"> Any matching tab exists (pre-join supported)</label>
    <label><input type="radio" name="mode" value="ACTIVE_TAB" id="mode_active"> Only when a matching tab is active (focused)</label>
  </div>

  <div class="card">
    <h2>3) Notify a local listener (optional)</h2>
    <label>
      Listener URL (GET):
      <input type="text" id="listener_url" placeholder="http://127.0.0.1:8765/event" />
    </label>
    <p class="muted">The extension calls <code>?state=ON</code> or <code>?state=OFF</code> plus <code>service</code> and <code>url</code>.</p>
  </div>

  <div class="card">
    <h2>4) Directly control your LED sign (optional)</h2>
    <label><input type="checkbox" id="direct_enabled"> Enable direct LED control from the extension</label>
    <div class="row">
      <div>
        <label>LED base URL
          <input type="text" id="led_base" placeholder="http://192.168.1.50" />
        </label>
        <p class="muted">Uses <code>/led/on</code> and <code>/led/off</code> (never toggle).</p>
      </div>
      <div>
        <label>HTTP timeout (seconds)
          <input type="number" id="http_timeout" min="1" max="20" step="1" value="3" />
        </label>
        <label><input type="checkbox" id="verify_status"> Verify using <code>/led/status</code> (skip calls if unreachable)</label>
      </div>
    </div>
  </div>

  <div class="btns">
    <button class="primary" id="save">Save</button>
    <button id="test_on">Test LED ON</button>
    <button id="test_off">Test LED OFF</button>
    <span class="status" id="status"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
