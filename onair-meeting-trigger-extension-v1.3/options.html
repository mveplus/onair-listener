<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ON-AIR Settings</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; }
    .card { max-width: 980px; border: 1px solid #ddd; border-radius: 14px; padding: 16px; margin: 12px 0; }
    h1 { margin: 0 0 8px 0; font-size: 20px; }
    h2 { margin: 0 0 8px 0; font-size: 16px; }
    label { display:block; margin: 8px 0; }
    input[type="text"], input[type="number"], select, textarea {
      width: 100%; max-width: 760px; padding: 8px; border-radius: 10px; border: 1px solid #ccc;
    }
    textarea { min-height: 74px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .row { display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .muted { color:#666; font-size: 13px; }
    .btns { display:flex; gap: 10px; align-items:center; margin-top: 12px; flex-wrap: wrap; }
    button { padding: 8px 12px; border-radius: 10px; border: 1px solid #ccc; background: #fafafa; cursor:pointer; }
    button.primary { border-color:#0aa; background:#e9ffff; }
    button.danger { border-color:#c33; background:#fff0f0; }
    .status { margin-left: 10px; font-size: 13px; color:#0a0; }
    code { background:#f4f4f4; padding: 2px 6px; border-radius: 6px; }
    .target { border:1px dashed #ddd; border-radius: 12px; padding: 12px; margin: 12px 0; }
    .targetHead { display:flex; align-items:center; justify-content:space-between; gap: 10px; flex-wrap: wrap; }
    .targetHead b { font-size: 14px; }
    .smallRow { display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; border:1px solid #ccc; font-size:12px; color:#444; }
  </style>
</head>
<body>
  <h1>ON-AIR Meeting Trigger — Settings</h1>

  <div class="card">
    <h2>1) Services</h2>
    <label><input type="checkbox" id="svc_meet"> Google Meet (meet.google.com)</label>
    <label><input type="checkbox" id="svc_teams"> Microsoft Teams (teams.microsoft.com)</label>
    <label><input type="checkbox" id="svc_zoom"> Zoom (zoom.us / app.zoom.us)</label>
  </div>

  <div class="card">
    <h2>2) Trigger mode</h2>
    <label><input type="radio" name="mode" value="ANY_TAB" id="mode_any"> Any matching tab exists (pre-join supported)</label>
    <label><input type="radio" name="mode" value="ACTIVE_TAB" id="mode_active"> Only when a matching tab is active (focused)</label>
  </div>

  <div class="card">
    <h2>3) HTTP settings</h2>
    <label>
      Timeout (seconds)
      <input type="number" id="http_timeout" min="1" max="20" step="1" value="3" />
    </label>
    <p class="muted">Applies to all targets.</p>
  </div>

  <div class="card">
    <h2>4) Targets (LAN / local outputs)</h2>
    <p class="muted">
      Add any number of outputs: local listener, your LED sign, Tasmota, Shelly, etc.<br/>
      You can use tokens: <code>{state}</code> <code>{service}</code> <code>{url}</code> <code>{ts}</code>
    </p>

    <div class="btns">
      <button id="add_listener">Add Listener</button>
      <button id="add_led">Add Simple LED</button>
      <button id="add_hook">Add HTTP Hook (Tasmota/etc.)</button>
    </div>

    <div id="targets"></div>
  </div>

  <div class="btns">
    <button class="primary" id="save">Save</button>
    <button id="test_on">Test ALL ON</button>
    <button id="test_off">Test ALL OFF</button>
    <span class="status" id="status"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
